<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生字 Spot It 生成器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px) translateX(-50%)' },
                            '100%': { opacity: '1', transform: 'translateY(0) translateX(-50%)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body {
            font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f0fdf4;
        }
        
        /* 列印專用樣式 */
        @media print {
            @page {
                margin: 10mm 10mm 12mm 10mm; 
            }
            body { background-color: white; }
            .no-print { display: none !important; }
            .print-area { padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: none !important; }
            .card-base {
                border: 2px dashed #9ca3af !important;
                background-color: transparent !important;
                box-shadow: none !important;
                transform: none !important;
            }
            .card-container {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 10px;
            }

            .size-letter6 {
                grid-template-columns: repeat(2, 1fr) !important;
                row-gap: 6mm !important;
                column-gap: 4mm !important;
            }
            .size-letter6 .card-container {
                width: 78mm !important; 
                max-width: 78mm !important;
                margin: 0 auto !important;
            }

            .size-letter6.shape-square-grid {
                justify-content: center !important;
                grid-template-columns: 78mm 78mm !important; 
                row-gap: 0 !important;
                column-gap: 0 !important;
            }
            .size-letter6.shape-square-grid .card-container {
                margin: 0 !important;
            }
            .shape-square-grid .card-base {
                border: 1px solid #9ca3af !important; 
            }

            /* 🎯 專屬 Letter Size (8.5x11) 一頁12張 的精準排版 (取代原本的8張) */
            .size-letter12 {
                grid-template-columns: repeat(3, 1fr) !important;
                row-gap: 2mm !important;
                column-gap: 2mm !important;
            }
            .size-letter12 .card-container {
                width: 64mm !important;
                max-width: 64mm !important;
                margin: 0 auto !important;
            }

            /* 🎯 方形卡片「一刀切」緊密排版 (列印專用調整) - 12張 */
            .size-letter12.shape-square-grid {
                justify-content: center !important;
                grid-template-columns: 64mm 64mm 64mm !important;
                row-gap: 0 !important;
                column-gap: 0 !important;
            }
            .size-letter12.shape-square-grid .card-container {
                margin: 0 !important;
            }
        }

        .card-base {
            position: relative;
            width: 100%;
            padding-bottom: 100%; 
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 4px solid #fca5a5;
            overflow: hidden;
            transition: box-shadow 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
        }

        .shape-square-grid {
            gap: 0 !important;
        }
        .shape-square-grid .card-container {
            padding: 0 !important;
        }
        .shape-square-grid .card-base {
            border-radius: 0 !important;
        }
        
        @media screen {
            .card-base:hover {
                transform: translateY(-2px) scale(1.02);
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
                border-color: #f87171;
            }
        }

        .word-item {
            position: absolute;
            transform-origin: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 
                -2px -2px 0 rgba(255,255,255,0.9),  
                 2px -2px 0 rgba(255,255,255,0.9),
                -2px  2px 0 rgba(255,255,255,0.9),
                 2px  2px 0 rgba(255,255,255,0.9),
                 0px  4px 4px rgba(0,0,0,0.2);
            white-space: nowrap;
            user-select: none;
            /* 新增：提示可以拖曳，並防止手機版拖曳時螢幕跟著滾動 */
            cursor: grab;
            touch-action: none;
        }
        .word-item:active {
            cursor: grabbing;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="root"></div>

    <script type="text/babel">
        const lessons = [
            { id: 1, name: "第一課", chars: "新同學自己年跟比", words: "比較 大家 方友朋 高興 跟 歡迎 今年 介紹 自己 看書 認識 現在 新 學 游泳 最 中文 張莉" },
            { id: 2, name: "第二課", chars: "外公以前工作班後", words: "幫 電腦公司 工作 上班 外公 外婆 一樣 以前 銀行 醫生 做生意" },
            { id: 3, name: "第三課", chars: "去近買東西魚還可", words: "冰淇淋 超級市場 東西 附近 可以 米 買 牛肉 巧克力 青菜 糖果 要 魚" },
            { id: 4, name: "第四課", chars: "出先週末晚蛋飯現點", words: "出去 蛋炒飯 餓 漢堡 快點 了 麵 薯條 湯 晚餐 晚飯 先 已經 玉米 再 週末" },
            { id: 5, name: "第五課", chars: "黃綠色時候花子紅白", words: "變 不錯 白色 春天 草 紅色 黃 還是 花 了 綠色 漂亮 秋天 時候 樹葉 天氣 院子 顏色 舒服" },
            { id: 6, name: "第六課", chars: "華說對星期會每給如果", words: "拜年 放鞭炮 給 紅包 會 每 那天 年糕 如果 說 台灣 貼春聯 新年 下 星期 華人 農曆" },
            { id: 7, name: "第七課", chars: "起累早洗昨過別忘用臉", words: "別 肥皂 乾淨 該 過 趕快 來不及 累 起床 刷牙 睡覺 晚上 忘 洗 洗澡 洗臉 用 知道 昨天" },
            { id: 8, name: "第八課", chars: "送隻狗帶散步貓非愛", words: "不見了 寵物 帶 非常 狗 可愛 貓 去年 送給 上個月 牠們 兔子 餵 養 隻 散步" },
            { id: 9, name: "第九課", chars: "南北方裡校門口因為所", words: "北方 東方 方向 告訴 教室 南方 所以 它 校門口 西方 因為 足球場 指北針 指南針 還是" },
            { id: 10, name: "第十課", chars: "本著退休次旅行法國", words: "阿姨 本來 法國 舅舅 看 旅行 紐約 台北 台南 退休 一次 住在 暑假" },
            { id: 11, name: "第十一課", chars: "動物園老希望但胖真長", words: "不但 脖子 長頸鹿 大象 動物園 猴子 看到 老虎 胖 企鵝 玩 熊貓 希望 這一次 長 真" },
            { id: 12, name: "第十二課", chars: "久話高課寫沒題定意思", words: "啊 過來 很久 好好 看起來 沒問題 上課 說話 瘦 網路 寫 信 有意思 一定 影像 長高" }
        ];

        function generateDobbleCards(symbols, p) {
            let n = p + 1;
            let cards = [];
            
            let card1 = [];
            for (let i = 0; i <= p; i++) { card1.push(symbols[i]); }
            cards.push(card1);

            for (let j = 0; j < p; j++) {
                let card = [];
                card.push(symbols[0]);
                for (let k = 0; k < p; k++) {
                    card.push(symbols[p + 1 + j * p + k]);
                }
                cards.push(card);
            }

            for (let i = 0; i < p; i++) {
                for (let j = 0; j < p; j++) {
                    let card = [];
                    card.push(symbols[i + 1]);
                    for (let k = 0; k < p; k++) {
                        card.push(symbols[p + 1 + k * p + (i * k + j) % p]);
                    }
                    cards.push(card);
                }
            }
            return cards;
        }

        const generateGlobalPalette = (count) => {
            const colors = [];
            for (let i = 0; i < count; i++) {
                const hue = (i * 137.508) % 360;
                let lightness = 45;
                if (hue > 40 && hue < 100) lightness = 35; 
                colors.push(`hsl(${Math.floor(hue)}, 85%, ${lightness}%)`);
            }
            return colors;
        };

        // 卡片元件：新增手動拖曳排版功能與固態記憶
        function Card({ words, shape, size, colorMode, wordColorMap, reshuffleKey }) {
            const n = words.length;
            
            const fontSizeMap = {
                'sm': 24, 
                'md': 32, 
                'letter12': 28, 
                'letter6': 36  
            };
            const baseFontSize = fontSizeMap[size] || 32;
            
            // 使用 useMemo 鎖定初始排版，避免畫面其他元素更新時亂跳
            const initialLayout = React.useMemo(() => {
                const layouts = [];
                const cardColors = [];
                for (let i = 0; i < n; i++) {
                    const hue = (360 / n) * i;
                    let lightness = 45;
                    if (hue > 40 && hue < 100) lightness = 35; 
                    cardColors.push(`hsl(${Math.floor(hue)}, 90%, ${lightness}%)`);
                }
                cardColors.sort(() => 0.5 - Math.random());

                words.forEach((word, i) => {
                    let angle, radius, scale, rotation;
                    let lenMod = 1;
                    const actualLength = [...word].length; 
                    if (actualLength === 2) lenMod = 0.90; 
                    if (actualLength === 3) lenMod = 0.75; 
                    if (actualLength >= 4) lenMod = 0.60; 

                    const densityScale = n >= 8 ? 0.70 : (n >= 6 ? 0.85 : 1); 

                    if (i === 0 && n > 3) {
                        angle = 0;
                        radius = 0;
                        const maxCenter = n >= 8 ? 1.2 : 1.4;
                        scale = (maxCenter + Math.random() * 0.3) * lenMod * densityScale; 
                        rotation = actualLength >= 2 ? (Math.random() * 30 - 15) : (Math.random() * 360);
                    } else {
                        const ringCount = n > 3 ? n - 1 : n;
                        const ringIndex = n > 3 ? i - 1 : i;
                        const baseAngle = (ringIndex / ringCount) * Math.PI * 2;
                        const jitter = (Math.random() * 0.3 - 0.15); 
                        angle = baseAngle + jitter;
                        
                        const maxR = shape === 'circle' ? 35 : 39;
                        const minR = n >= 8 ? 26 : 20; 
                        radius = minR + Math.random() * (maxR - minR); 
                        
                        let rawScale = (0.85 + Math.random() * 0.4) * lenMod * densityScale;
                        scale = Math.max(0.50, rawScale); 

                        if (actualLength >= 2) {
                            let tangDeg = (angle * 180 / Math.PI) + 90; 
                            rotation = tangDeg + (Math.random() * 40 - 20); 
                            if (rotation > 90 && rotation < 270) {
                                rotation += 180;
                            }
                        } else {
                            rotation = Math.random() * 360; 
                        }
                    }

                    const x = 50 + radius * Math.cos(angle);
                    const y = 50 + radius * Math.sin(angle);
                    
                    layouts.push({ word, x, y, rotation, scale, color: cardColors[i], zIndex: Math.floor(Math.random() * 10) });
                });
                return layouts;
            }, [words, shape, reshuffleKey]); // 當洗牌鍵更新時，才重新計算

            // 滑鼠/觸控拖曳事件處理 (原生 DOM 操作，極致順暢且不觸發 React 重新渲染)
            const handlePointerDown = (e) => {
                // 忽略非左鍵點擊
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                
                const el = e.currentTarget;
                el.setPointerCapture(e.pointerId);
                
                const startX = e.clientX;
                const startY = e.clientY;
                
                const currentLeft = parseFloat(el.style.left);
                const currentTop = parseFloat(el.style.top);
                const originalZ = el.style.zIndex;
                
                const container = el.parentElement;
                const rect = container.getBoundingClientRect();
                
                // 拖曳時將該字拉到最上層
                el.style.zIndex = 100;
                
                const onPointerMove = (moveEvent) => {
                    const dx = moveEvent.clientX - startX;
                    const dy = moveEvent.clientY - startY;
                    
                    // 將 px 轉換回 %
                    const newLeft = currentLeft + (dx / rect.width) * 100;
                    const newTop = currentTop + (dy / rect.height) * 100;
                    
                    el.style.left = `${newLeft}%`;
                    el.style.top = `${newTop}%`;
                };
                
                const onPointerUp = (upEvent) => {
                    el.releasePointerCapture(upEvent.pointerId);
                    el.removeEventListener('pointermove', onPointerMove);
                    el.removeEventListener('pointerup', onPointerUp);
                    el.style.zIndex = originalZ; // 放開後恢復原來圖層
                };
                
                el.addEventListener('pointermove', onPointerMove);
                el.addEventListener('pointerup', onPointerUp);
            };

            let shapeClass = 'rounded-2xl'; 
            if (shape === 'circle') shapeClass = 'rounded-full';
            if (shape === 'square') shapeClass = 'rounded-none';

            return (
                <div className="card-container p-2 w-full mx-auto">
                    <div className={`card-base ${shapeClass}`}>
                        {initialLayout.map((item, i) => {
                            const color = colorMode === 'fixed' 
                                ? wordColorMap[item.word] 
                                : item.color;

                            return (
                                <div 
                                    key={`${item.word}-${i}`} 
                                    className="word-item"
                                    onPointerDown={handlePointerDown}
                                    style={{
                                        left: `${item.x}%`,
                                        top: `${item.y}%`,
                                        transform: `translate(-50%, -50%) rotate(${item.rotation}deg) scale(${item.scale})`,
                                        color: color,
                                        fontSize: `${baseFontSize}px`,
                                        zIndex: item.zIndex
                                    }}
                                    title="拖曳我來微調位置！"
                                >
                                    {item.word}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        const parseInputToWords = (text) => {
            return Array.from(new Set(text.split(/[\s,、，。;；\/]+/).filter(w => w.trim().length > 0)));
        };

        function App() {
            const [inputType, setInputType] = React.useState("words"); 
            const [inputText, setInputText] = React.useState("");
            const [wordsPerCard, setWordsPerCard] = React.useState(3);
            const [cards, setCards] = React.useState([]);
            const [error, setError] = React.useState("");
            const [cardShape, setCardShape] = React.useState("circle");
            const [cardSize, setCardSize] = React.useState("letter6"); 
            
            const [colorMode, setColorMode] = React.useState("fixed"); 
            const [wordColorMap, setWordColorMap] = React.useState({});

            const [toast, setToast] = React.useState("");
            const [reshuffleKey, setReshuffleKey] = React.useState(0); // 新增：專門控制洗牌的鑰匙

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(""), 2500);
            };

            const switchMode = (mode) => {
                setInputType(mode);
                setInputText(""); 
                setCards([]);
                setError("");
                showToast(mode === 'chars' ? "🅰️ 已切換為【單個生字】模式" : "📚 已切換為【完整生詞】模式");
            };

            const handleLessonAdd = (lesson) => {
                setInputText(prev => {
                    const prevWords = parseInputToWords(prev);
                    let newWords = [];
                    
                    if (inputType === 'chars') {
                        newWords = lesson.chars.replace(/\s/g, '').split('');
                    } else {
                        newWords = lesson.words.split(' ');
                    }
                    
                    const combined = Array.from(new Set([...prevWords, ...newWords]));
                    return combined.join(' '); 
                });
                showToast(`➕ 已加入「${lesson.name}」的${inputType === 'chars' ? '生字' : '生詞'}`);
            };

            const clearInput = () => {
                setInputText("");
                setCards([]);
                setError("");
                showToast("🗑️ 已清空");
            };

            const requiredWordsMap = { 3: 7, 4: 13, 6: 31, 8: 57 };
            const primeMap = { 3: 2, 4: 3, 6: 5, 8: 7 };

            const handleGenerate = () => {
                setError("");
                const uniqueWords = parseInputToWords(inputText);
                const requiredCount = requiredWordsMap[wordsPerCard];
                
                if (uniqueWords.length < requiredCount) {
                    setError(`目前有 ${uniqueWords.length} 個字/詞。選擇「每張 ${wordsPerCard} 個」，至少需要 ${requiredCount} 個項目喔！`);
                    setCards([]);
                    return;
                }

                const selectedWords = uniqueWords.sort(() => 0.5 - Math.random()).slice(0, requiredCount);
                
                const currentPalette = generateGlobalPalette(selectedWords.length);
                const shuffledPalette = currentPalette.sort(() => 0.5 - Math.random());
                const newColorMap = {};
                selectedWords.forEach((word, index) => {
                    newColorMap[word] = shuffledPalette[index];
                });
                setWordColorMap(newColorMap);

                const p = primeMap[wordsPerCard];
                const generated = generateDobbleCards(selectedWords, p);
                
                const finalCards = generated.map(card => card.sort(() => 0.5 - Math.random()));
                setCards(finalCards.sort(() => 0.5 - Math.random()));
                setReshuffleKey(prev => prev + 1); // 產生時重置一次排版
            };

            const handleReshuffle = () => {
                if(cards.length > 0) {
                    setReshuffleKey(prev => prev + 1); // 觸發排版重新計算
                    showToast("🔀 已重新隨機排列大小與位置！");
                }
            };

            const uniqueCount = parseInputToWords(inputText).length;
            const targetCount = requiredWordsMap[wordsPerCard];

            let gridClass = "grid ";
            if (cardShape !== 'square') {
                gridClass += "gap-4 ";
            }

            if (cardSize === 'sm') {
                gridClass += "grid-cols-3 md:grid-cols-4 lg:grid-cols-5 print:grid-cols-4";
            } else if (cardSize === 'letter12') {
                gridClass += "grid-cols-3 md:grid-cols-4 lg:grid-cols-5 print:grid-cols-3 size-letter12";
            } else if (cardSize === 'letter6') {
                gridClass += "grid-cols-2 md:grid-cols-3 print:grid-cols-2 size-letter6";
            } else {
                gridClass += "grid-cols-2 md:grid-cols-3 lg:grid-cols-4 print:grid-cols-3";
            }

            if (cardShape === 'square') {
                gridClass += " shape-square-grid";
            }

            return (
                <div className="min-h-screen pb-6 flex flex-col relative">
                    {toast && (
                        <div className="fixed top-24 left-1/2 z-50 animate-fade-in-up bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm z-[100]">
                            {toast}
                        </div>
                    )}

                    <div className="bg-emerald-600 text-white p-6 shadow-md no-print">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <i className="ph-fill ph-cards text-4xl"></i>
                                <div>
                                    <h1 className="text-2xl font-bold tracking-wide">生字/生詞 Spot It! 生成器</h1>
                                    <p className="text-emerald-100 text-sm mt-1">單字模式、完整生詞自由切換，完美支援手動拖曳微調！</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl w-full mx-auto mt-8 px-4 flex flex-col md:flex-row gap-8 print-area flex-1">
                        <div className="w-full md:w-80 lg:w-96 flex-shrink-0 space-y-5 no-print">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                                <h2 className="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <i className="ph-fill ph-magic-wand text-emerald-500"></i>
                                    1. 選擇模式與加入課文
                                </h2>
                                
                                <div className="flex gap-2 mb-4">
                                    <button 
                                        onClick={() => switchMode('chars')}
                                        className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all border ${inputType === 'chars' ? 'bg-emerald-500 text-white border-emerald-600 shadow-md' : 'bg-white text-emerald-600 border-emerald-200 hover:bg-emerald-50'}`}
                                    >
                                        🅰️ 單個生字
                                    </button>
                                    <button 
                                        onClick={() => switchMode('words')}
                                        className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all border ${inputType === 'words' ? 'bg-emerald-500 text-white border-emerald-600 shadow-md' : 'bg-white text-emerald-600 border-emerald-200 hover:bg-emerald-50'}`}
                                    >
                                        📚 完整生詞
                                    </button>
                                </div>

                                <div className="grid grid-cols-3 gap-2">
                                    {lessons.map(l => (
                                        <button 
                                            key={l.id}
                                            onClick={() => handleLessonAdd(l)}
                                            className="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 py-2 rounded-lg border border-emerald-200 transition-colors active:scale-95"
                                        >
                                            {l.name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                                <div className="flex justify-between items-center mb-2">
                                    <h2 className="text-base font-bold text-gray-800 flex items-center gap-2">
                                        <i className="ph-fill ph-pencil-simple-text text-emerald-500"></i>
                                        2. 編輯字庫 <span className="text-xs text-emerald-600 ml-1">(用空白鍵分隔)</span>
                                    </h2>
                                    <button onClick={clearInput} className="text-xs text-red-500 hover:text-red-600 px-2 py-1 rounded hover:bg-red-50 transition-colors">清空</button>
                                </div>
                                <textarea 
                                    className="w-full h-28 p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-400 focus:outline-none text-base leading-relaxed"
                                    placeholder="請先選擇上方模式並點擊課文，或手動輸入（例如：電腦公司 超級市場 買東西）..."
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                ></textarea>
                                <div className="mt-2 text-sm text-gray-500 flex justify-between font-bold">
                                    <span>字/詞數量：{uniqueCount} / {targetCount}</span>
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                                <h2 className="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <i className="ph-fill ph-gear text-emerald-500"></i>
                                    3. 設定與排版
                                </h2>
                                <div className="space-y-4 mb-5">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">每張字數 (難度)</label>
                                        <select className="w-full p-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-400" value={wordsPerCard} onChange={(e) => setWordsPerCard(Number(e.target.value))}>
                                            <option value={3}>簡單：3個 (需 7 個項目)</option>
                                            <option value={4}>適中：4個 (需 13 個項目)</option>
                                            <option value={6}>挑戰：6個 (需 31 個項目)</option>
                                            <option value={8}>魔王：8個 (需 57 個項目)</option>
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">字體顏色</label>
                                        <div className="flex bg-gray-100 rounded-lg p-1">
                                            <button onClick={() => setColorMode('fixed')} className={`flex-1 text-xs py-1.5 rounded-md ${colorMode === 'fixed' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>固定 (易認字)</button>
                                            <button onClick={() => setColorMode('random')} className={`flex-1 text-xs py-1.5 rounded-md ${colorMode === 'random' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>隨機 (挑戰高)</button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 mb-1">卡片形狀</label>
                                            <div className="flex bg-gray-100 rounded-lg p-1">
                                                <button onClick={() => setCardShape('circle')} className={`flex-1 text-[11px] py-1.5 rounded-md ${cardShape === 'circle' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>圓形</button>
                                                <button onClick={() => setCardShape('rounded-square')} className={`flex-1 text-[11px] py-1.5 rounded-md ${cardShape === 'rounded-square' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>圓角方</button>
                                                <button onClick={() => setCardShape('square')} className={`flex-1 text-[11px] py-1.5 rounded-md ${cardShape === 'square' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>直角方</button>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 mb-1">列印大小</label>
                                            <div className="flex bg-gray-100 rounded-lg p-1">
                                                <button onClick={() => setCardSize('sm')} className={`flex-1 text-xs py-1.5 rounded-md ${cardSize === 'sm' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>小</button>
                                                <button onClick={() => setCardSize('md')} className={`flex-1 text-xs py-1.5 rounded-md ${cardSize === 'md' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>中</button>
                                                <button onClick={() => setCardSize('letter12')} className={`flex-1 text-[11px] py-1.5 rounded-md ${cardSize === 'letter12' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>Letter(12)</button>
                                                <button onClick={() => setCardSize('letter6')} className={`flex-1 text-[11px] py-1.5 rounded-md ${cardSize === 'letter6' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>Letter(6)</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                {error && <div className="mb-4 p-2 bg-red-50 text-red-600 text-xs rounded-lg border border-red-200 flex items-center gap-1"><i className="ph-fill ph-warning-circle"></i>{error}</div>}
                                <button onClick={handleGenerate} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition-all flex justify-center items-center gap-2">
                                    <i className="ph-bold ph-cards"></i>
                                    產生卡片
                                </button>
                            </div>
                        </div>

                        <div className="w-full flex-1 print-area">
                            {cards.length === 0 ? (
                                <div className="h-full min-h-[400px] border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center text-gray-400 p-8 no-print bg-white/50">
                                    <i className="ph-fill ph-cards text-6xl mb-4 text-emerald-200"></i>
                                    <p className="text-xl font-bold text-gray-500">請先點擊左側「模式按鈕」後加入課文！</p>
                                </div>
                            ) : (
                                <div>
                                    <div className="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 no-print bg-white p-4 rounded-xl shadow-sm border border-emerald-50">
                                        <div className="text-sm font-bold text-emerald-700 flex items-center gap-2">
                                            <i className="ph-fill ph-hand-pointing text-xl"></i>
                                            ✨ 提示：現在您可以直接用滑鼠或手指「拖曳」卡片上的字來微調位置喔！
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={handleReshuffle} className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-2 px-4 rounded-lg border border-indigo-200 text-sm flex items-center gap-1">
                                                <i className="ph-bold ph-arrows-clockwise"></i>洗牌重排
                                            </button>
                                            <button onClick={() => window.print()} className="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-5 rounded-lg shadow text-sm flex items-center gap-1">
                                                <i className="ph-bold ph-printer"></i>列印卡片
                                            </button>
                                        </div>
                                    </div>
                                    <div className={gridClass}>
                                        {cards.map((card, idx) => (
                                            <Card 
                                                key={`card-${idx}`} 
                                                words={card} 
                                                shape={cardShape} 
                                                size={cardSize}
                                                colorMode={colorMode}
                                                wordColorMap={wordColorMap}
                                                reshuffleKey={reshuffleKey}
                                            />
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <footer className="mt-8 mb-2 text-center text-emerald-800/60 text-sm font-medium print:fixed print:bottom-3 print:left-0 print:w-full print:text-gray-400 print:text-[12px] print:pb-0 print:mt-0">
                        Created by Sophia Wong
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
