                { id: 4, name: "Lesson 4", chars: "出先週末晚蛋飯現點", words: "出去 蛋炒飯 餓 漢堡 快點 了 麵 薯條 湯 晚餐 晚飯 先 已經 玉米 再 週末" },
                { id: 5, name: "Lesson 5", chars: "黃綠色時候花子紅白", words: "變 不錯 白色 春天 草 紅色 黃 還是 花 了 綠色 漂亮 秋天 時候 樹葉 天氣 院子 顏色 舒服" },
                { id: 6, name: "Lesson 6", chars: "華說對星期會每給如果", words: "拜年 放鞭炮 給 紅包 會 每 那天 年糕 如果 說 台灣 貼春聯 新年 下 星期 華人 農曆" },
                { id: 7, name: "Lesson 7", chars: "起累早洗昨過別忘用臉", words: "別 肥皂 乾淨 該 過 趕快 來不及 累 起床 刷牙 睡覺 晚上 忘 洗 洗澡 洗臉 用 知道 昨天" },
                { id: 8, name: "Lesson 8", chars: "送隻狗帶散步貓非愛", words: "不見了 寵物 帶 非常 狗 可愛 貓 去年 送給 上個月 牠們 兔子 餵 養 隻 散步" },
                { id: 9, name: "Lesson 9", chars: "南北方裡校門口因為所", words: "北方 東方 方向 告訴 教室 南方 所以 它 校門口 西方 因為 足球場 指北針 指南針 還是" },
                { id: 10, name: "Lesson 10", chars: "本著退休次旅行法國", words: "阿姨 本來 法國 舅舅 看 旅行 紐約 台北 台南 退休 一次 住在 暑假" },
                { id: 11, name: "Lesson 11", chars: "動物園老希望但胖真長", words: "不但 脖子 長頸鹿 大象 動物園 猴子 看到 老虎 胖 企鵝 玩 熊貓 希望 這一次 長 真" },
                { id: 12, name: "Lesson 12", chars: "久話高課寫沒題定意思", words: "啊 過來 很久 好好 看起來 沒問題 上課 說話 瘦 網路 寫 信 有意思 一定 影像 長高" }
            ]
        };

        function generateDobbleCards(symbols, p) {
            let n = p + 1;
            let cards = [];
            
            let card1 = [];
            for (let i = 0; i <= p; i++) { card1.push(symbols[i]); }
            cards.push(card1);

            for (let j = 0; j < p; j++) {
                let card = [];
                card.push(symbols[0]);
                for (let k = 0; k < p; k++) {
                    card.push(symbols[p + 1 + j * p + k]);
                }
                cards.push(card);
            }

            for (let i = 0; i < p; i++) {
                for (let j = 0; j < p; j++) {
                    let card = [];
                    card.push(symbols[i + 1]);
                    for (let k = 0; k < p; k++) {
                        card.push(symbols[p + 1 + k * p + (i * k + j) % p]);
                    }
                    cards.push(card);
                }
            }
            return cards;
        }

        const generateGlobalPalette = (count) => {
            const colors = [];
            for (let i = 0; i < count; i++) {
                const hue = (i * 137.508) % 360;
                let lightness = 45;
                if (hue > 40 && hue < 100) lightness = 35; 
                colors.push(`hsl(${Math.floor(hue)}, 85%, ${lightness}%)`);
            }
            return colors;
        };

        function Card({ words, shape, size, colorMode, wordColorMap, reshuffleKey, dragTipText, fontFamily, fontScale }) {
            const n = words.length;
            
            const fontSizeMap = {
                'sm': 22, 
                'md': 28, 
                'lg': 36  
            };
            const baseFontSize = fontSizeMap[size] || 28;
            
            const initialLayout = React.useMemo(() => {
                const layouts = [];
                const cardColors = [];
                for (let i = 0; i < n; i++) {
                    const hue = (360 / n) * i;
                    let lightness = 45;
                    if (hue > 40 && hue < 100) lightness = 35; 
                    cardColors.push(`hsl(${Math.floor(hue)}, 90%, ${lightness}%)`);
                }
                cardColors.sort(() => 0.5 - Math.random());

                words.forEach((word, i) => {
                    let angle, radius, scale, rotation;
                    let lenMod = 1;
                    const actualLength = [...word].length; 
                    if (actualLength === 2) lenMod = 0.90; 
                    if (actualLength === 3) lenMod = 0.75; 
                    if (actualLength >= 4) lenMod = 0.65; 

                    const densityScale = n >= 8 ? 0.75 : (n >= 6 ? 0.90 : 1); 

                    if (i === 0 && n > 3) {
                        angle = 0;
                        radius = 0;
                        const maxCenter = n >= 8 ? 1.3 : 1.5;
                        scale = (maxCenter + Math.random() * 0.4) * lenMod * densityScale; 
                        rotation = actualLength >= 2 ? (Math.random() * 30 - 15) : (Math.random() * 360);
                    } else {
                        const ringCount = n > 3 ? n - 1 : n;
                        const ringIndex = n > 3 ? i - 1 : i;
                        const baseAngle = (ringIndex / ringCount) * Math.PI * 2;
                        const jitter = n >= 8 ? (Math.random() * 0.2 - 0.1) : (Math.random() * 0.6 - 0.3); 
                        angle = baseAngle + jitter;
                        
                        const maxR = shape === 'circle' ? 34 : 36;
                        const radiusJitter = n >= 8 ? (Math.random() * 4) : (Math.random() * 12);
                        radius = maxR - radiusJitter; 
                        
                        let rawScale = (0.85 + Math.random() * 0.6) * lenMod * densityScale;
                        scale = Math.max(0.55, rawScale); 

                        if (actualLength >= 2) {
                            let tangDeg = (angle * 180 / Math.PI) + 90; 
                            rotation = tangDeg + (Math.random() * 40 - 20); 
                            if (rotation > 90 && rotation < 270) {
                                rotation += 180;
                            }
                        } else {
                            rotation = Math.random() * 360; 
                        }
                    }

                    const x = 50 + radius * Math.cos(angle);
                    const y = 50 + radius * Math.sin(angle);
                    
                    layouts.push({ word, x, y, rotation, scale, color: cardColors[i], zIndex: Math.floor(Math.random() * 10) });
                });
                return layouts;
            }, [words, shape, reshuffleKey]); 

            const handlePointerDown = (e) => {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                
                const el = e.currentTarget;
                el.setPointerCapture(e.pointerId);
                
                const startX = e.clientX;
                const startY = e.clientY;
                
                const currentLeft = parseFloat(el.style.left);
                const currentTop = parseFloat(el.style.top);
                const originalZ = el.style.zIndex;
                
                const container = el.parentElement;
                const rect = container.getBoundingClientRect();
                
                el.style.zIndex = 100;
                
                const onPointerMove = (moveEvent) => {
                    const dx = moveEvent.clientX - startX;
                    const dy = moveEvent.clientY - startY;
                    
                    const newLeft = currentLeft + (dx / rect.width) * 100;
                    const newTop = currentTop + (dy / rect.height) * 100;
                    
                    el.style.left = `${newLeft}%`;
                    el.style.top = `${newTop}%`;
                };
                
                const onPointerUp = (upEvent) => {
                    el.releasePointerCapture(upEvent.pointerId);
                    el.removeEventListener('pointermove', onPointerMove);
                    el.removeEventListener('pointerup', onPointerUp);
                    el.style.zIndex = originalZ; 
                };
                
                el.addEventListener('pointermove', onPointerMove);
                el.addEventListener('pointerup', onPointerUp);
            };

            let shapeClass = shape === 'circle' ? 'rounded-full' : 'rounded-none';

            const getFontFamilyString = (type) => {
                switch(type) {
                    case 'kaiti': return '"BiaoKai", "Kaiti TC", "STKaiti", "KaiTi", serif';
                    case 'serif': return '"PMingLiU", "MingLiU", "Songti TC", "SimSun", serif';
                    case 'sans-serif': default: return '"PingFang TC", "Heiti TC", "Microsoft JhengHei", "SimHei", sans-serif';
                }
            };

            return (
                <div className="card-container p-2 w-full mx-auto">
                    <div className={`card-base ${shapeClass}`}>
                        {initialLayout.map((item, i) => {
                            const color = colorMode === 'fixed' 
                                ? wordColorMap[item.word] 
                                : item.color;

                            return (
                                <div 
                                    key={`${item.word}-${i}`} 
                                    className="word-item"
                                    onPointerDown={handlePointerDown}
                                    style={{
                                        left: `${item.x}%`,
                                        top: `${item.y}%`,
                                        transform: `translate(-50%, -50%) rotate(${item.rotation}deg) scale(${item.scale})`,
                                        color: color,
                                        fontFamily: getFontFamilyString(fontFamily),
                                        fontSize: `${baseFontSize * fontScale}px`,
                                        zIndex: item.zIndex
                                    }}
                                    title={dragTipText}
                                >
                                    {item.word}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        const parseInputToWords = (text) => {
            return Array.from(new Set(text.split(/[\s,、，。;；\n\r\/]+/).filter(w => w.trim().length > 0)));
        };

        function App() {
            const [lang, setLang] = React.useState("zh-TW"); // 🌐 語言狀態
            const t = (key) => i18n[lang][key] || key; // 翻譯函式
            const formatStr = (str, ...args) => args.reduce((s, a, i) => s.replace(`{${i}}`, a), str);

            const [inputType, setInputType] = React.useState("words"); 
            const [inputText, setInputText] = React.useState("");
            const [wordsPerCard, setWordsPerCard] = React.useState(3);
            const [cards, setCards] = React.useState([]);
            const [error, setError] = React.useState("");
            const [cardShape, setCardShape] = React.useState("circle");
            const [cardSize, setCardSize] = React.useState("md"); 
            
            const [colorMode, setColorMode] = React.useState("fixed"); 
            const [fontFamily, setFontFamily] = React.useState("sans-serif"); 
            const [fontScale, setFontScale] = React.useState(1.0); 
            
            const [wordColorMap, setWordColorMap] = React.useState({});

            const [toast, setToast] = React.useState("");
            const [reshuffleKey, setReshuffleKey] = React.useState(0); 
            
            const [showModal, setShowModal] = React.useState(false);
            const fileInputRef = React.useRef(null);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(""), 2500);
            };

            const switchMode = (mode) => {
                setInputType(mode);
                // 為了不打擾使用者，模式切換不強制清空輸入框，只給予提示
                showToast(mode === 'chars' ? t('toastChar') : t('toastWord'));
            };

            const handleLessonAdd = (lesson) => {
                setInputText(prev => {
                    const prevWords = parseInputToWords(prev);
                    let newWords = [];
                    
                    if (inputType === 'chars') {
                        newWords = lesson.chars.replace(/\s/g, '').split('');
                    } else {
                        newWords = lesson.words.split(' ');
                    }
                    
                    const combined = Array.from(new Set([...prevWords, ...newWords]));
                    return combined.join(' '); 
                });
                const typeStr = inputType === 'chars' ? t('toastTypeChar') : t('toastTypeWord');
                showToast(formatStr(t('toastAdd'), lesson.name, typeStr));
                setShowModal(false); 
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    setInputText(prev => {
                        const prevWords = parseInputToWords(prev);
                        const newWords = parseInputToWords(text);
                        const combined = Array.from(new Set([...prevWords, ...newWords]));
                        return combined.join(' ');
                    });
                    showToast(formatStr(t('toastImport'), file.name));
                };
                reader.readAsText(file);
                e.target.value = null; 
            };

            const clearInput = () => {
                setInputText("");
                setCards([]);
                setError("");
                showToast(t('toastClear'));
            };

            const requiredWordsMap = { 3: 7, 4: 13, 6: 31, 8: 57 };
            const primeMap = { 3: 2, 4: 3, 6: 5, 8: 7 };

            const handleGenerate = () => {
                setError("");
                const uniqueWords = parseInputToWords(inputText);
                const requiredCount = requiredWordsMap[wordsPerCard];
                
                if (uniqueWords.length < requiredCount) {
                    setError(formatStr(t('errNeedMore'), uniqueWords.length, wordsPerCard, requiredCount));
                    setCards([]);
                    return;
                }

                const selectedWords = uniqueWords.sort(() => 0.5 - Math.random()).slice(0, requiredCount);
                
                const currentPalette = generateGlobalPalette(selectedWords.length);
                const shuffledPalette = currentPalette.sort(() => 0.5 - Math.random());
                const newColorMap = {};
                selectedWords.forEach((word, index) => {
                    newColorMap[word] = shuffledPalette[index];
                });
                setWordColorMap(newColorMap);

                const p = primeMap[wordsPerCard];
                const generated = generateDobbleCards(selectedWords, p);
                
                const finalCards = generated.map(card => card.sort(() => 0.5 - Math.random()));
                setCards(finalCards.sort(() => 0.5 - Math.random()));
                setReshuffleKey(prev => prev + 1); 
            };

            const handleReshuffle = () => {
                if(cards.length > 0) {
                    setReshuffleKey(prev => prev + 1); 
                    showToast(t('toastReshuffle'));
                }
            };

            const uniqueCount = parseInputToWords(inputText).length;
            const targetCount = requiredWordsMap[wordsPerCard];

            let gridClass = "grid ";
            if (cardShape !== 'square') {
                gridClass += "gap-4 ";
            }

            if (cardSize === 'sm') {
                gridClass += "grid-cols-4 md:grid-cols-5 lg:grid-cols-6 print:grid-cols-4 size-sm";
            } else if (cardSize === 'md') {
                gridClass += "grid-cols-3 md:grid-cols-4 lg:grid-cols-5 print:grid-cols-3 size-md";
            } else if (cardSize === 'lg') {
                gridClass += "grid-cols-2 md:grid-cols-3 print:grid-cols-2 size-lg";
            }

            if (cardShape === 'square') {
                gridClass += " shape-square-grid";
            }

            const currentLessons = lessonsData[lang] || lessonsData['zh-TW'];

            return (
                <div className="min-h-screen pb-6 flex flex-col relative">
                    {toast && (
                        <div className="fixed top-24 left-1/2 z-50 animate-fade-in-up bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm z-[250]">
                            {toast}
                        </div>
                    )}

                    {showModal && (
                        <div className="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-modal-fade-in">
                                <div className="bg-emerald-500 p-4 flex justify-between items-center text-white">
                                    <h3 className="font-bold text-lg flex items-center gap-2">
                                        <i className="ph-bold ph-books"></i> 
                                        {t('modalTitle')} 
                                        <span className="text-sm font-normal text-emerald-100 ml-1 tracking-wider">{t('modalSubtitle')}</span>
                                    </h3>
                                    <button onClick={() => setShowModal(false)} className="hover:text-emerald-200 transition-colors">
                                        <i className="ph-bold ph-x text-xl"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto">
                                    <div className="flex gap-2 mb-5">
                                        <button 
                                            onClick={() => switchMode('chars')}
                                            className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all border ${inputType === 'chars' ? 'bg-emerald-500 text-white border-emerald-600 shadow-md' : 'bg-white text-emerald-600 border-emerald-200 hover:bg-emerald-50'}`}
                                        >
                                            {t('modeChar')}
                                        </button>
                                        <button 
                                            onClick={() => switchMode('words')}
                                            className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all border ${inputType === 'words' ? 'bg-emerald-500 text-white border-emerald-600 shadow-md' : 'bg-white text-emerald-600 border-emerald-200 hover:bg-emerald-50'}`}
                                        >
                                            {t('modeWord')}
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-3 gap-3">
                                        {currentLessons.map(l => (
                                            <button 
                                                key={l.id}
                                                onClick={() => handleLessonAdd(l)}
                                                className="text-sm bg-emerald-50 hover:bg-emerald-100 text-emerald-800 py-3 rounded-lg border border-emerald-200 transition-colors active:scale-95 font-medium shadow-sm"
                                            >
                                                {l.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-end">
                                    <button onClick={() => setShowModal(false)} className="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300 transition-colors text-sm">{t('cancelBtn')}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-emerald-600 text-white p-6 shadow-md no-print relative z-10">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div className="flex items-center gap-3">
                                <i className="ph-fill ph-cards text-4xl"></i>
                                <div>
                                    <h1 className="text-2xl font-bold tracking-wide">{t('title')}</h1>
                                    <p className="text-emerald-100 text-sm mt-1">{t('subtitle')}</p>
                                </div>
                            </div>
                            {/* 🌐 語言切換按鈕 */}
                            <div className="flex bg-emerald-700/50 rounded-lg p-1 border border-emerald-500/30">
                                <button onClick={() => setLang('zh-TW')} className={`px-3 py-1.5 text-sm font-bold rounded-md transition-colors ${lang === 'zh-TW' ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-100 hover:text-white'}`}>繁中</button>
                                <button onClick={() => setLang('zh-CN')} className={`px-3 py-1.5 text-sm font-bold rounded-md transition-colors ${lang === 'zh-CN' ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-100 hover:text-white'}`}>简中</button>
                                <button onClick={() => setLang('en')} className={`px-3 py-1.5 text-sm font-bold rounded-md transition-colors ${lang === 'en' ? 'bg-white text-emerald-700 shadow-sm' : 'text-emerald-100 hover:text-white'}`}>EN</button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl w-full mx-auto mt-8 px-4 flex flex-col md:flex-row gap-8 print-area flex-1 relative z-10">
                        <div className="w-full md:w-80 lg:w-96 flex-shrink-0 space-y-5 no-print">
                            
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-base font-bold text-gray-800 flex items-center gap-2">
                                        <i className="ph-fill ph-pencil-simple-text text-emerald-500"></i>
                                        {t('step1')}
                                    </h2>
                                    <button onClick={clearInput} className="text-xs text-red-500 hover:text-red-600 px-2 py-1 rounded hover:bg-red-50 transition-colors">{t('clearBtn')}</button>
                                </div>
                                
                                <div className="flex gap-2 mb-3">
                                    <button onClick={() => setShowModal(true)} className="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-sm font-bold py-2 rounded-lg border border-emerald-200 transition-colors flex items-center justify-center gap-1 shadow-sm">
                                        <i className="ph-bold ph-books text-lg"></i>{t('builtInBtn')}
                                    </button>
                                    <button onClick={() => fileInputRef.current.click()} className="flex-1 bg-white hover:bg-gray-50 text-emerald-700 text-sm font-bold py-2 rounded-lg border border-emerald-200 transition-colors flex items-center justify-center gap-1 shadow-sm">
                                        <i className="ph-bold ph-upload-simple text-lg"></i>{t('importBtn')}
                                    </button>
                                    <input 
                                        type="file" 
                                        accept=".txt,.csv" 
                                        ref={fileInputRef} 
                                        onChange={handleFileUpload} 
                                        className="hidden" 
                                    />
                                </div>

                                <div className="text-xs text-emerald-700 bg-emerald-50/50 p-2.5 rounded-lg mb-3 border border-emerald-100 flex gap-2 items-start leading-relaxed">
                                    <i className="ph-fill ph-info text-base text-emerald-500"></i>
                                    <p>
                                        <strong>{t('importTipTitle')}</strong> <span dangerouslySetInnerHTML={{ __html: t('importTipDesc') }} />
                                    </p>
                                </div>

                                <textarea 
                                    className="w-full h-32 p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-400 focus:outline-none text-base leading-relaxed"
                                    placeholder={t('placeholder')}
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                ></textarea>
                                <div className="mt-2 text-sm text-gray-500 flex justify-between font-bold">
                                    <span>{t('itemCount')} {uniqueCount} / {targetCount}</span>
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                                <h2 className="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
                                    <i className="ph-fill ph-gear text-emerald-500"></i>
                                    {t('step2')}
                                </h2>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                                    {/* 難度與字體微調 */}
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">{t('difficulty')}</label>
                                        <select className="w-full p-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-400" value={wordsPerCard} onChange={(e) => setWordsPerCard(Number(e.target.value))}>
                                            <option value={3}>{t('diff3')}</option>
                                            <option value={4}>{t('diff4')}</option>
                                            <option value={6}>{t('diff6')}</option>
                                            <option value={8}>{t('diff8')}</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1 flex justify-between">
                                            <span>{t('fontScaleLabel')}</span>
                                            <span className="text-emerald-600">{Math.round(fontScale * 100)}%</span>
                                        </label>
                                        <div className="flex items-center h-[38px]">
                                            <input 
                                                type="range" 
                                                min="0.6" 
                                                max="1.6" 
                                                step="0.05" 
                                                value={fontScale} 
                                                onChange={(e) => setFontScale(parseFloat(e.target.value))}
                                                className="w-full accent-emerald-500"
                                            />
                                        </div>
                                    </div>

                                    {/* 顏色與字體風格 */}
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">{t('colorLabel')}</label>
                                        <div className="flex bg-gray-100 rounded-lg p-1">
                                            <button onClick={() => setColorMode('fixed')} className={`flex-1 text-xs py-1.5 rounded-md ${colorMode === 'fixed' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('colorFixed')}</button>
                                            <button onClick={() => setColorMode('random')} className={`flex-1 text-xs py-1.5 rounded-md ${colorMode === 'random' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('colorRandom')}</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">{t('fontStyleLabel')}</label>
                                        <div className="flex bg-gray-100 rounded-lg p-1">
                                            <button onClick={() => setFontFamily('sans-serif')} className={`flex-1 text-xs py-1.5 rounded-md ${fontFamily === 'sans-serif' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('fontSans')}</button>
                                            <button onClick={() => setFontFamily('kaiti')} className={`flex-1 text-xs py-1.5 rounded-md ${fontFamily === 'kaiti' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('fontKaiti')}</button>
                                            <button onClick={() => setFontFamily('serif')} className={`flex-1 text-xs py-1.5 rounded-md ${fontFamily === 'serif' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('fontSerif')}</button>
                                        </div>
                                    </div>

                                    {/* 形狀與大小 */}
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">{t('shapeLabel')}</label>
                                        <div className="flex bg-gray-100 rounded-lg p-1">
                                            <button onClick={() => setCardShape('circle')} className={`flex-1 text-[11px] py-1.5 rounded-md ${cardShape === 'circle' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('shapeCircle')}</button>
                                            <button onClick={() => setCardShape('square')} className={`flex-1 text-[11px] py-1.5 rounded-md ${cardShape === 'square' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('shapeSquare')}</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">{t('sizeLabel')}</label>
                                        <div className="flex bg-gray-100 rounded-lg p-1">
                                            <button onClick={() => setCardSize('lg')} className={`flex-1 text-xs py-1.5 rounded-md ${cardSize === 'lg' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('sizeLg')}</button>
                                            <button onClick={() => setCardSize('md')} className={`flex-1 text-xs py-1.5 rounded-md ${cardSize === 'md' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('sizeMd')}</button>
                                            <button onClick={() => setCardSize('sm')} className={`flex-1 text-xs py-1.5 rounded-md ${cardSize === 'sm' ? 'bg-white shadow text-emerald-600 font-bold' : 'text-gray-500 hover:text-gray-700'}`}>{t('sizeSm')}</button>
                                        </div>
                                    </div>
                                </div>
                                {error && <div className="mb-4 p-2 bg-red-50 text-red-600 text-xs rounded-lg border border-red-200 flex items-center gap-1"><i className="ph-fill ph-warning-circle"></i>{error}</div>}
                                <button onClick={handleGenerate} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition-all flex justify-center items-center gap-2">
                                    <i className="ph-bold ph-cards"></i>
                                    {t('generateBtn')}
                                </button>
                            </div>
                        </div>

                        <div className="w-full flex-1 print-area relative z-10">
                            {cards.length === 0 ? (
                                <div className="h-full min-h-[400px] border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center text-gray-400 p-8 no-print bg-white/50">
                                    <i className="ph-fill ph-cards text-6xl mb-4 text-emerald-200"></i>
                                    <p className="text-xl font-bold text-gray-500">{t('emptyState')}</p>
                                </div>
                            ) : (
                                <div>
                                    <div className="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 no-print bg-white p-4 rounded-xl shadow-sm border border-emerald-50">
                                        <div className="text-sm font-bold text-emerald-700 flex items-center gap-2">
                                            <i className="ph-fill ph-hand-pointing text-xl"></i>
                                            {t('dragTip')}
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={handleReshuffle} className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-2 px-4 rounded-lg border border-indigo-200 text-sm flex items-center gap-1">
                                                <i className="ph-bold ph-arrows-clockwise"></i>{t('reshuffleBtn')}
                                            </button>
                                            <button onClick={() => window.print()} className="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-5 rounded-lg shadow text-sm flex items-center gap-1">
                                                <i className="ph-bold ph-printer"></i>{t('printBtn')}
                                            </button>
                                        </div>
                                    </div>
                                    <div className={gridClass}>
                                        {cards.map((card, idx) => (
                                            <Card 
                                                key={`card-${idx}`} 
                                                words={card} 
                                                shape={cardShape} 
                                                size={cardSize}
                                                colorMode={colorMode}
                                                wordColorMap={wordColorMap}
                                                reshuffleKey={reshuffleKey}
                                                dragTipText={t('dragHover')}
                                                fontFamily={fontFamily}
                                                fontScale={fontScale}
                                            />
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <footer className="mt-8 mb-2 text-center text-emerald-800/60 text-sm font-medium print:fixed print:bottom-3 print:left-0 print:w-full print:text-gray-400 print:text-[12px] print:pb-0 print:mt-0">
                        {t('footer')}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
